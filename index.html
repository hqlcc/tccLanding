<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta name="theme-color" content="#00140f" />

    <meta
      name="description"
      content="Transforme tarefas domésticas em missões colaborativas."
    />

    <script>
      (() => {
        let theme;
        try {
          theme = localStorage.getItem("houseflow-theme");
        } catch {}
        if (theme !== "light" && theme !== "dark") {
          theme = window.matchMedia("(prefers-color-scheme: light)").matches
            ? "light"
            : "dark";
        }
        document.documentElement.dataset.theme = theme;
        document.querySelector('meta[name="theme-color"]').content =
          theme === "dark" ? "#0d1916" : "#f3f3f3";
      })();
    </script>
    <link rel="icon" type="image/x-icon" href="public\favicon.ico" />
    <title>HouseFlow</title>
  </head>

  <body>
    <div id="root"></div>
    <noscript
      >Ative o JavaScript no navegador para acessar o HouseFlow.</noscript
    >

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
